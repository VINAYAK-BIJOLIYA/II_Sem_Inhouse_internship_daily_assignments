<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Directory</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">

  <h1>Student Directory</h1>
  <p>searchable by name, ID, or standing.</p>
</div>

<div class="container">
  <div class="control-panel">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label class="control-label">Search by name or ID</label>
        <input type="text" id="searchInput" class="form-control" placeholder="e.g. Meera Nair or STU-1042">
      </div>
      <div class="col-md-4">
        <label class="control-label">Department</label>
        <select id="deptFilter" class="form-select">
          <option value="">All departments</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="control-label">Sort by</label>
        <select id="sortFilter" class="form-select">
          <option value="name">Name (A–Z)</option>
          <option value="cgpa-desc">CGPA (High–Low)</option>
          <option value="cgpa-asc">CGPA (Low–High)</option>
        </select>
      </div>
    </div>

    <div class="mt-3">
      <label class="control-label">CGPA standing</label>
      <div class="d-flex flex-wrap gap-2">
        <button class="cgpa-chip active" data-min="0" data-max="10">All</button>
        <button class="cgpa-chip" data-min="9" data-max="10">9.0 +</button>
        <button class="cgpa-chip" data-min="8" data-max="8.99">8.0 – 8.99</button>
        <button class="cgpa-chip" data-min="7" data-max="7.99">7.0 – 7.99</button>
        <button class="cgpa-chip" data-min="0" data-max="6.99">Below 7.0</button>
      </div>
    </div>
  </div>
</div>

<div class="container card-grid">
  <div class="d-flex justify-content-end mb-3">
    <span class="result-count"><span id="resultCount">0</span> students on file</span>
  </div>
  <div class="row g-4" id="cardContainer"></div>
  <div class="empty-state d-none" id="emptyState">
    No matching entries.
    <div class="sub">Try a different name, ID, or CGPA range.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
